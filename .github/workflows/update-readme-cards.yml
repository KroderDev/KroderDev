name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - ".github/workflows/update-readme-cards.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=tokyonight&show_icons=true&hide_border=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=tokyonight&show_icons=true&hide_border=true&layout=compact&langs_count=8&size_weight=0.7&count_weight=0.3&hide=scss,tex,shaderlab
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats-action@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&mode=weekly&card_width=780
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "ci(readme): update GitHub stats cards" || exit 0
          git push
